appId: com.automark.desktop
productName: AutoMark
electronDist: ../launcher/node_modules/electron/dist
directories:
  output: release
files:
  - main.js
  - package.json
  - assets/**
extraResources:
  # server：from 目录整体复制（node_modules 被默认过滤，单独补一条）
  - from: ../build/server
    to: server
  - from: ../build/server/node_modules
    to: server/node_modules
  - from: ../web/dist
    to: web
  - from: ../vision/dist/automark-vision
    to: vision
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AutoMark
electronLanguages:
  - zh-CN
  - en-US
